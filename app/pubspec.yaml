name: small_gallery
description: "Small Gallery — a personal online gallery for amateur painters and photographers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  desktop_drop: ">=0.6.0 <0.9.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
