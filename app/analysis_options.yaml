include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    # Generated by `flutter gen-l10n`.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: false
